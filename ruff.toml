line-length = 100
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",    # длинные строки
    "B008",    # вызов функции в default
    "N999",    # имя проекта FinalProject
    "BLE001",  # except Exception
    "FURB162", # .replace("Z", "+00:00")
]